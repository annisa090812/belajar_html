<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="name"> Username: </label>
    <input type="text" name="name" placeholder="Username" required><br>
    <label for="password"> Password</label>
    <input type="password" name="password" placeholder="Password" required>
<br>
<label for="jenis kelamin"> Jenis Kelamin:</label>
    <label for="laki-laki"> laki-laki</label>
    <input type="radio" id="laki-laki" name="jenis kelamin" value="laki-laki">
    <label for="perempuan"> perempuan</label>
    <input type="radio" id="perempuan" name="Jenis Kelamin" value="Perempuan">
<br>
<lebel for="kelas"> Kelas: </lebel>
    <label for="X"> X </label>
    <input type="checkbox" id="X" name="kelas" value="X">
    <label for="XI"> XI </label>
    <input type="checkbox" id="XI" name="kelas" value="XI">
    <label for="XII"> XII </label>
    <input type="checkbox" id="XII" name="kelas" value="XII">
<br>
<label for="Hobi"> Hobi: </label>
    <select id="Hobi" name="Hobi">
    <option value="Melukis">Melukis</option>
    <option value="Menggambar">Menggambar</option>
    <option value="Badminton">Badminton</option>
  </select><br>
<label for="alamat">Alamat:</label><br>
  <textarea id="alamat" name="alamat" rows="4" cols="50" placeholder="Tuliskan alamat Anda di sini..."></textarea>


</body>
</html>
